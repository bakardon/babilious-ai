<svg class="dog" id="dog" data-state="idle" viewBox="0 0 400 400" role="img"
     aria-labelledby="dog-title" xmlns="http://www.w3.org/2000/svg">
  <title id="dog-title">Babilious, a fat curly dog</title>
  <defs>
    <pattern id="curls" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="5" fill="none" stroke="#241309" stroke-width="2" opacity=".55"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#5a3824" stroke-width="1.6" opacity=".5"/>
      <circle cx="16" cy="16" r="4" fill="none" stroke="#5a3824" stroke-width="1.6" opacity=".5"/>
    </pattern>
    <radialGradient id="belly-shade" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#a87653"/><stop offset="1" stop-color="#7a4f33"/>
    </radialGradient>
    <g id="head-shape">
      <ellipse cx="200" cy="168" rx="112" ry="98"/>
      <circle cx="128" cy="98" r="26"/><circle cx="162" cy="80" r="28"/><circle cx="200" cy="74" r="29"/>
      <circle cx="238" cy="80" r="28"/><circle cx="272" cy="98" r="26"/>
    </g>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#f6b44a"/><stop offset="1" stop-color="#b8661c"/>
    </radialGradient>
  </defs>

  <!-- tail (behind the body) -->
  <g class="tail">
    <circle cx="322" cy="300" r="20" fill="#3b2417"/>
    <circle cx="336" cy="282" r="15" fill="#3b2417"/>
    <circle cx="342" cy="264" r="12" fill="#3b2417"/>
    <circle cx="336" cy="282" r="15" fill="url(#curls)"/>
  </g>

  <!-- body: fat, round, shirtless -->
  <g class="body">
    <ellipse cx="200" cy="335" rx="138" ry="100" fill="#3b2417"/>
    <ellipse cx="200" cy="335" rx="138" ry="100" fill="url(#curls)"/>
    <ellipse class="belly" cx="200" cy="350" rx="86" ry="66" fill="url(#belly-shade)"/>
    <path d="M150 330 Q200 316 250 330" fill="none" stroke="#6a432b" stroke-width="3" opacity=".6"/>
    <path d="M196 362 q4 6 8 0" fill="none" stroke="#4a2c1b" stroke-width="3" stroke-linecap="round"/>
    <!-- arms resting on the belly -->
    <ellipse cx="112" cy="345" rx="30" ry="48" fill="#3b2417" transform="rotate(18 112 345)"/>
    <ellipse cx="288" cy="345" rx="30" ry="48" fill="#3b2417" transform="rotate(-18 288 345)"/>
    <ellipse cx="128" cy="385" rx="26" ry="16" fill="#4a2e1d"/>
    <ellipse cx="272" cy="385" rx="26" ry="16" fill="#4a2e1d"/>
    <path d="M118 388 v-6 M128 390 v-7 M138 388 v-6 M262 388 v-6 M272 390 v-7 M282 388 v-6"
          stroke="#2a160c" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- head (tilts as one group) -->
  <g class="head">
    <!-- double chin -->
    <ellipse cx="200" cy="240" rx="80" ry="34" fill="#3b2417"/>
    <path d="M140 248 Q200 278 260 248" fill="none" stroke="#24140b" stroke-width="3" opacity=".6"/>

    <!-- head + curly top tuft, drawn twice: solid fur, then the curl texture -->
    <use href="#head-shape" fill="#3b2417"/>
    <use href="#head-shape" fill="url(#curls)"/>

    <!-- floppy curly ears -->
    <g class="ear ear-l">
      <ellipse cx="98" cy="185" rx="34" ry="66" fill="#2f1c11" transform="rotate(14 98 185)"/>
      <ellipse cx="98" cy="185" rx="34" ry="66" fill="url(#curls)" transform="rotate(14 98 185)"/>
    </g>
    <g class="ear ear-r">
      <ellipse cx="302" cy="185" rx="34" ry="66" fill="#2f1c11" transform="rotate(-14 302 185)"/>
      <ellipse cx="302" cy="185" rx="34" ry="66" fill="url(#curls)" transform="rotate(-14 302 185)"/>
    </g>

    <!-- brows -->
    <path class="brow brow-l" d="M140 128 Q160 118 180 126" fill="none" stroke="#1d0f07" stroke-width="6" stroke-linecap="round"/>
    <path class="brow brow-r" d="M220 126 Q240 118 260 128" fill="none" stroke="#1d0f07" stroke-width="6" stroke-linecap="round"/>

    <!-- eyes: one group per expression, CSS shows the right one -->
    <g class="eyes eyes-open">
      <g class="eye"><circle cx="160" cy="155" r="17" fill="#1b0e06"/><circle cx="160" cy="155" r="13" fill="url(#iris)"/>
        <circle class="pupil" cx="160" cy="156" r="6.5" fill="#120804"/><circle cx="165" cy="150" r="3.2" fill="#fff"/></g>
      <g class="eye"><circle cx="240" cy="155" r="17" fill="#1b0e06"/><circle cx="240" cy="155" r="13" fill="url(#iris)"/>
        <circle class="pupil" cx="240" cy="156" r="6.5" fill="#120804"/><circle cx="245" cy="150" r="3.2" fill="#fff"/></g>
      <!-- heavy lids for the unimpressed / annoyed look -->
      <path class="lids" d="M140 150 Q160 136 180 150 Z M220 150 Q240 136 260 150 Z" fill="#3b2417"/>
    </g>
    <g class="eyes eyes-happy" fill="none" stroke="#1b0e06" stroke-width="6" stroke-linecap="round">
      <path d="M144 160 Q160 142 176 160"/><path d="M224 160 Q240 142 256 160"/>
    </g>
    <g class="eyes eyes-closed" fill="none" stroke="#1b0e06" stroke-width="5" stroke-linecap="round">
      <path d="M144 155 Q160 166 176 155"/><path d="M224 155 Q240 166 256 155"/>
    </g>
    <g class="eyes eyes-x" stroke="#1b0e06" stroke-width="6" stroke-linecap="round">
      <path d="M148 143 l24 24 M172 143 l-24 24"/><path d="M228 143 l24 24 M252 143 l-24 24"/>
    </g>

    <!-- muzzle + nose -->
    <ellipse cx="200" cy="212" rx="56" ry="40" fill="#6b4630"/>
    <ellipse cx="200" cy="212" rx="56" ry="40" fill="url(#curls)" opacity=".5"/>
    <ellipse cx="200" cy="193" rx="20" ry="13" fill="#140a05"/>
    <ellipse cx="194" cy="189" rx="6" ry="3" fill="#fff" opacity=".45"/>
    <path d="M200 206 v8" stroke="#140a05" stroke-width="3.5" stroke-linecap="round"/>

    <!-- mouths -->
    <g class="mouth mouth-smile" fill="none" stroke="#140a05" stroke-width="4" stroke-linecap="round">
      <path d="M178 216 Q189 228 200 214 Q211 228 222 216"/>
    </g>
    <g class="mouth mouth-tongue">
      <path d="M178 216 Q189 228 200 214 Q211 228 222 216" fill="none" stroke="#140a05" stroke-width="4" stroke-linecap="round"/>
      <path d="M192 222 Q192 246 204 246 Q214 246 212 222 Z" fill="#e8738a" stroke="#140a05" stroke-width="2.5"/>
      <path d="M202 226 v14" stroke="#c4566c" stroke-width="2"/>
    </g>
    <g class="mouth mouth-open">
      <path d="M180 216 Q200 254 220 216 Z" fill="#3a0f14" stroke="#140a05" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M188 236 Q200 230 212 236 Q206 246 200 246 Q194 246 188 236Z" fill="#e8738a"/>
    </g>
    <g class="mouth mouth-flat"><path d="M184 222 H216" stroke="#140a05" stroke-width="4" stroke-linecap="round"/></g>
    <g class="mouth mouth-smirk"><path d="M182 222 Q204 224 220 212" fill="none" stroke="#140a05" stroke-width="4" stroke-linecap="round"/></g>
    <g class="mouth mouth-frown"><path d="M182 228 Q200 214 218 228" fill="none" stroke="#140a05" stroke-width="4" stroke-linecap="round"/></g>
    <g class="mouth mouth-o"><ellipse cx="200" cy="226" rx="8" ry="10" fill="#3a0f14" stroke="#140a05" stroke-width="3"/></g>
  </g>

  <!-- state props -->
  <g class="prop prop-think" fill="#c9b8ff">
    <circle cx="300" cy="80" r="7"/><circle cx="322" cy="58" r="10"/><circle cx="350" cy="34" r="14"/>
  </g>
  <g class="prop prop-listen" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round">
    <path d="M44 150 q-14 30 0 60"/><path d="M26 136 q-22 44 0 88"/>
    <path d="M356 150 q14 30 0 60"/><path d="M374 136 q22 44 0 88"/>
  </g>
  <g class="prop prop-zzz" fill="#c9b8ff" font-family="DM Sans, system-ui, sans-serif" font-weight="700">
    <text x="292" y="92" font-size="30">z</text><text x="318" y="62" font-size="38">z</text><text x="350" y="30" font-size="46">Z</text>
  </g>
  <g class="prop prop-question" font-family="DM Sans, system-ui, sans-serif" font-weight="800" fill="#fbbf24">
    <text x="300" y="90" font-size="72">?</text>
  </g>
  <g class="prop prop-alert" font-family="DM Sans, system-ui, sans-serif" font-weight="800" fill="#f87171">
    <text x="306" y="92" font-size="76">!</text>
  </g>
  <g class="prop prop-steam" fill="#e5e7eb" opacity=".85">
    <circle cx="300" cy="74" r="12"/><circle cx="318" cy="64" r="15"/><circle cx="336" cy="74" r="11"/>
  </g>
  <g class="prop prop-sparkle" fill="#fde68a">
    <path d="M60 80 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M336 60 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M350 200 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
  </g>
  <g class="prop prop-hearts" fill="#f472b6">
    <path d="M318 70 c0 -10 14 -10 14 0 c0 -10 14 -10 14 0 c0 10 -14 18 -14 22 c0 -4 -14 -12 -14 -22z"/>
  </g>
</svg>
